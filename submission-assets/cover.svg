<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4f8fa" />
      <stop offset="100%" stop-color="#dcecef" />
    </linearGradient>
    <linearGradient id="wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#008b93" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#008b93" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#008b93" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>

  <!-- UI Mockup Rectangle -->
  <g transform="translate(900, 240)">
    <rect width="800" height="600" rx="16" fill="#ffffff" stroke="#c7dbe2" stroke-width="4"/>
    <rect width="800" height="60" rx="16" fill="#eaf2f5" />
    <circle cx="30" cy="30" r="8" fill="#ef4444"/>
    <circle cx="60" cy="30" r="8" fill="#eab308"/>
    <circle cx="90" cy="30" r="8" fill="#22c55e"/>

    <text x="50" y="140" fill="#15394b" font-family="sans-serif" font-size="32" font-weight="bold">Evidence-based feedback</text>
    <rect x="50" y="180" width="700" height="120" rx="8" fill="#eaf2f5"/>
    <text x="80" y="230" fill="#426171" font-family="sans-serif" font-size="24">During the call: rubric observation</text>
    <text x="80" y="270" fill="#008b93" font-family="sans-serif" font-size="24">Exact quote + validated evidence</text>

    <rect x="50" y="340" width="330" height="200" rx="8" fill="#eaf2f5"/>
    <text x="80" y="390" fill="#008b93" font-family="sans-serif" font-size="24" font-weight="bold">Strength</text>
    <text x="80" y="440" fill="#426171" font-family="sans-serif" font-size="20">What worked and why</text>

    <rect x="420" y="340" width="330" height="200" rx="8" fill="#eaf2f5"/>
    <text x="450" y="390" fill="#bd6b29" font-family="sans-serif" font-size="24" font-weight="bold">Next attempt</text>
    <text x="450" y="440" fill="#426171" font-family="sans-serif" font-size="20">One behavior to improve</text>
  </g>

  <!-- Left Text -->
  <g transform="translate(160, 480)">
    <text x="0" y="0" fill="#15394b" font-family="sans-serif" font-size="120" font-weight="900" letter-spacing="-2">Sparring</text>
    <text x="8" y="80" fill="#426171" font-family="sans-serif" font-size="40" font-weight="400">Practice the tough conversations.</text>
  </g>

  <!-- Voice Waveform Abstract -->
  <path d="M 160,700 Q 240,550 320,700 T 480,700 T 640,700 T 800,700 T 960,700" fill="none" stroke="url(#wave)" stroke-width="12" stroke-linecap="round"/>
  <path d="M 160,700 Q 240,750 320,700 T 480,700 T 640,700 T 800,700 T 960,700" fill="none" stroke="url(#wave)" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
  <path d="M 160,700 Q 240,650 320,700 T 480,700 T 640,700 T 800,700 T 960,700" fill="none" stroke="url(#wave)" stroke-width="6" stroke-linecap="round" opacity="0.4"/>
</svg>
